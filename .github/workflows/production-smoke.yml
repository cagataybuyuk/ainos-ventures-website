name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apex root redirects to English
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o /dev/null https://ainosventures.com/
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          echo "status=$status location=$location"
          test "$status" = '308'
          case "$location" in
            /en/|https://ainosventures.com/en/) ;;
            *) echo "Unexpected root redirect: $location"; exit 1 ;;
          esac

      - name: English production page is current
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' https://ainosventures.com/en/)"
          echo "status=$status"
          test "$status" = '200'
          grep -q 'Strategy\. Capital\. Partnership\.' "$body"
          grep -q 'Current Focus' "$body"
          grep -Fq '<link rel="canonical" href="https://ainosventures.com/en/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="en" href="https://ainosventures.com/en/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="tr" href="https://ainosventures.com/tr/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="x-default" href="https://ainosventures.com/en/">' "$body"
          grep -Fq '<meta property="og:url" content="https://ainosventures.com/en/">' "$body"
          grep -q '/assets/css/team-tuning.css' "$body"
          grep -q 'Tunca Cingöz' "$body"
          grep -q 'Brings an entrepreneurial and commercial perspective to strategy, business development, investments and long-term partnerships.' "$body"
          grep -q 'Nidan Akmanoğlu' "$body"
          grep -q 'Brings a financial and strategic perspective to transactions, capital structuring, transformation and value creation.' "$body"
          grep -q 'https://ainosventures.com/assets/images/ainos-social-card.png' "$body"
          grep -q 'summary_large_image' "$body"
          if grep -Eqi 'www\.ainosventures\.com|ainos-ventures-website\.vercel\.app' "$body"; then
            echo 'English production page contains a non-canonical host.'
            exit 1
          fi

      - name: Turkish production page is current
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' https://ainosventures.com/tr/)"
          echo "status=$status"
          test "$status" = '200'
          grep -q 'Güncel Odak' "$body"
          grep -Fq '<link rel="canonical" href="https://ainosventures.com/tr/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="en" href="https://ainosventures.com/en/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="tr" href="https://ainosventures.com/tr/">' "$body"
          grep -Fq '<link rel="alternate" hreflang="x-default" href="https://ainosventures.com/en/">' "$body"
          grep -Fq '<meta property="og:url" content="https://ainosventures.com/tr/">' "$body"
          grep -q '/assets/css/team-tuning.css' "$body"
          grep -q 'Tunca Cingöz' "$body"
          grep -q 'Strateji, iş geliştirme, yatırımlar ve uzun vadeli iş ortaklıklarına girişimci ve ticari bir bakış açısı getirir.' "$body"
          grep -q 'Nidan Akmanoğlu' "$body"
          grep -q 'İşlemler, sermaye yapılandırması, dönüşüm ve değer yaratımına finansal ve stratejik bir bakış açısı getirir.' "$body"
          grep -q 'https://ainosventures.com/assets/images/ainos-social-card.png' "$body"
          grep -q 'summary_large_image' "$body"
          if grep -Eqi 'www\.ainosventures\.com|ainos-ventures-website\.vercel\.app' "$body"; then
            echo 'Turkish production page contains a non-canonical host.'
            exit 1
          fi

      - name: WWW redirects to canonical apex
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o /dev/null https://www.ainosventures.com/en/
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          echo "status=$status location=$location"
          test "$status" = '308'
          case "$location" in
            https://ainosventures.com/en/|https://ainosventures.com/en) ;;
            *) echo "Unexpected www redirect: $location"; exit 1 ;;
          esac

      - name: Production security headers are strict
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o /dev/null https://ainosventures.com/en/
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^content-security-policy:' "$headers"
          grep -qi '^x-content-type-options:[[:space:]]*nosniff' "$headers"
          csp="$(awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          echo "csp=$csp"
          echo "$csp" | grep -Fq "style-src 'self'"
          if echo "$csp" | grep -Fqi "'unsafe-inline'"; then
            echo 'Production CSP unexpectedly allows unsafe-inline.'
            exit 1
          fi

      - name: Robots sitemap and public assets are reachable
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsS --connect-timeout 10 --max-time 30 https://ainosventures.com/robots.txt -o "$tmp/robots"
          grep -Fxq 'User-agent: *' "$tmp/robots"
          grep -Fxq 'Allow: /' "$tmp/robots"
          grep -Fxq 'Sitemap: https://ainosventures.com/sitemap.xml' "$tmp/robots"
          if grep -Fxiq 'Disallow: /' "$tmp/robots"; then
            echo 'Production robots.txt blocks the entire site.'
            exit 1
          fi

          curl -fsS --connect-timeout 10 --max-time 30 https://ainosventures.com/sitemap.xml -o "$tmp/sitemap"
          python3 - "$tmp/sitemap" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          sitemap_ns = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          xhtml_ns = 'http://www.w3.org/1999/xhtml'
          expected_urls = {
              'https://ainosventures.com/en/',
              'https://ainosventures.com/tr/',
          }
          expected_alternates = {
              'en': 'https://ainosventures.com/en/',
              'tr': 'https://ainosventures.com/tr/',
              'x-default': 'https://ainosventures.com/en/',
          }

          root = ET.parse(path).getroot()
          if root.tag != f'{{{sitemap_ns}}}urlset':
              raise SystemExit('Unexpected sitemap root element')

          seen = set()
          for url_el in root.findall(f'{{{sitemap_ns}}}url'):
              loc_el = url_el.find(f'{{{sitemap_ns}}}loc')
              loc = (loc_el.text or '').strip() if loc_el is not None else ''
              if not loc:
                  raise SystemExit('Sitemap URL entry missing loc')
              if loc in seen:
                  raise SystemExit(f'Duplicate sitemap URL: {loc}')
              seen.add(loc)

              alternates = {}
              for link in url_el.findall(f'{{{xhtml_ns}}}link'):
                  if link.attrib.get('rel') == 'alternate':
                      alternates[link.attrib.get('hreflang')] = link.attrib.get('href')
              if alternates != expected_alternates:
                  raise SystemExit(f'Unexpected hreflang set for {loc}: {alternates}')

          if seen != expected_urls:
              raise SystemExit(f'Unexpected sitemap URL set: {seen}')

          raw = open(path, encoding='utf-8').read()
          for forbidden in ('http://ainosventures.com', 'www.ainosventures.com', 'vercel.app'):
              if forbidden in raw:
                  raise SystemExit(f'Sitemap contains forbidden host pattern: {forbidden}')
          print('production sitemap SEO contract=PASS')
          PY

          for url in \
            https://ainosventures.com/assets/css/site-enhancements.css \
            https://ainosventures.com/assets/css/team-tuning.css \
            https://ainosventures.com/assets/images/tunca-web.jpg \
            https://ainosventures.com/assets/images/nidan-web.jpg \
            https://ainosventures.com/assets/images/ainos-social-card.png; do
            status="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $status"
            test "$status" = '200'
          done

          social_headers="$tmp/social-headers"
          social_file="$tmp/social-card.png"
          curl -fsS --connect-timeout 10 --max-time 30 -D "$social_headers" https://ainosventures.com/assets/images/ainos-social-card.png -o "$social_file"
          grep -qi '^content-type:[[:space:]]*image/png' "$social_headers"
          python3 - "$social_file" <<'PY'
          import struct
          import sys

          raw = open(sys.argv[1], 'rb').read(24)
          if raw[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Social image is not PNG')
          width, height = struct.unpack('>II', raw[16:24])
          print(f'social image dimensions={width}x{height}')
          if (width, height) != (1200, 630):
              raise SystemExit('Unexpected social image dimensions')
          PY

      - name: Missing routes serve branded noindex 404
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -LsS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' https://ainosventures.com/__ainos_smoke_not_found__)"
          echo "final status=$status"
          test "$status" = '404'
          grep -q 'Page not found\.' "$body"
          grep -q 'Türkçe Ana Sayfa' "$body"
          grep -q '/assets/css/site-enhancements.css' "$body"
          grep -qi 'name="robots" content="noindex"' "$body"
          if grep -qi 'rel="canonical"' "$body"; then
            echo 'Served 404 must not declare a canonical URL.'
            exit 1
          fi
          if grep -qi ' style=' "$body"; then
            echo 'Served 404 unexpectedly contains inline styles.'
            exit 1
          fi

      - name: Legacy staging alias is non-indexable
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o /dev/null https://ainos-ventures-website.vercel.app/en/
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          robots="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          vercel_error="$(awk 'BEGIN{IGNORECASE=1} /^x-vercel-error:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r$/,""); print}' "$headers" | tail -1)"
          echo "status=$status location=$location x-robots-tag=$robots x-vercel-error=$vercel_error"

          if echo "$robots" | grep -qi 'noindex'; then
            exit 0
          fi

          case "$status:$location" in
            301:https://ainosventures.com/*|302:https://ainosventures.com/*|307:https://ainosventures.com/*|308:https://ainosventures.com/*) exit 0 ;;
          esac

          if [ "$status" = '404' ] && [ "$vercel_error" = 'DEPLOYMENT_NOT_FOUND' ]; then
            exit 0
          fi

          echo 'Legacy staging must be noindex, redirect to production, or remain unavailable.'
          exit 1
