name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site structure and SEO
        run: python scripts/site_check.py
      - name: Validate release configuration
        run: python scripts/release_check.py
      - name: Validate Vercel configuration JSON
        run: python -m json.tool vercel.json > /dev/null
      - name: Validate JavaScript syntax
        run: node --check assets/js/main.js
