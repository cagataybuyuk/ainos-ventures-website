name: V2 Phase A visual QA

on:
  push:
    branches: [v2-phase-a-prototype]
    paths:
      - 'prototype/v2/**'
      - 'assets/css/v2-prototype.css'
      - '.github/workflows/v2-phase-a-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install browser controller
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Start local site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ainos-v2-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/prototype/v2/ >/dev/null && curl -fsS http://127.0.0.1:4173/prototype/v2/tr/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ainos-v2-http.log >&2 || true
          exit 1

      - name: Capture bilingual prototype references
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          mkdir -p qa-v2-phase-a
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          const path = require('path');
          const widths = [1440, 1024, 768, 390, 360];
          const sections = ['top', 'focus', 'markets', 'team'];
          const prototypes = [
            { language: 'en', url: 'http://127.0.0.1:4173/prototype/v2/' },
            { language: 'tr', url: 'http://127.0.0.1:4173/prototype/v2/tr/' }
          ];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars']
            });
            try {
              for (const prototype of prototypes) {
                for (const width of widths) {
                  const page = await browser.newPage();
                  await page.setViewport({ width, height: 1100, deviceScaleFactor: 1 });
                  await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                  await page.goto(prototype.url, { waitUntil: 'networkidle0' });
                  await wait(150);

                  const state = await page.evaluate(() => ({
                    overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                    robots: document.querySelector('meta[name="robots"]')?.content || '',
                    title: document.title,
                    hero: document.querySelector('.hero h1')?.textContent?.trim() || '',
                    focusCount: document.querySelectorAll('#focus .focus-card').length,
                    teamCount: document.querySelectorAll('#team .person').length
                  }));

                  if (state.overflow > 1) throw new Error(`${prototype.language}: horizontal overflow at ${width}px: ${state.overflow}px`);
                  if (!state.robots.includes('noindex')) throw new Error(`${prototype.language}: prototype must remain noindex`);
                  if (!state.hero.includes('Strategy.')) throw new Error(`${prototype.language}: hero positioning missing`);
                  if (state.focusCount !== 4) throw new Error(`${prototype.language}: expected four Current Focus rows`);
                  if (state.teamCount !== 2) throw new Error(`${prototype.language}: expected two founder profiles`);

                  for (const section of sections) {
                    await page.evaluate((id) => {
                      const el = document.getElementById(id);
                      if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
                    }, section);
                    await wait(150);
                    await page.screenshot({ path: path.join('qa-v2-phase-a', `${prototype.language}-${width}-${section}.png`), fullPage: false });
                  }
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          JS

          ls -lh qa-v2-phase-a

      - name: Upload V2 Phase A references
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase-a-visual-qa
          path: qa-v2-phase-a/*.png
          if-no-files-found: error
          retention-days: 14
