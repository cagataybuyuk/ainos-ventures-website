name: V2 Phase A visual QA

on:
  push:
    branches: [v2-phase-a-prototype]
    paths:
      - 'prototype/v2/**'
      - 'assets/css/v2-prototype.css'
      - '.github/workflows/v2-phase-a-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install browser controller
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Start local site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ainos-v2-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/prototype/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ainos-v2-http.log >&2 || true
          exit 1

      - name: Capture prototype references
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          mkdir -p qa-v2-phase-a
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          const path = require('path');
          const widths = [1440, 1024, 768, 390, 360];
          const sections = ['top', 'focus', 'markets', 'team'];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars']
            });
            try {
              for (const width of widths) {
                const page = await browser.newPage();
                await page.setViewport({ width, height: 1100, deviceScaleFactor: 1 });
                await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                await page.goto('http://127.0.0.1:4173/prototype/v2/', { waitUntil: 'networkidle0' });
                await wait(150);

                const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
                if (overflow > 1) throw new Error(`Horizontal overflow at ${width}px: ${overflow}px`);

                for (const section of sections) {
                  await page.evaluate((id) => {
                    const el = document.getElementById(id);
                    if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
                  }, section);
                  await wait(150);
                  await page.screenshot({ path: path.join('qa-v2-phase-a', `${width}-${section}.png`), fullPage: false });
                }
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          JS

          ls -lh qa-v2-phase-a

      - name: Upload V2 Phase A references
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase-a-visual-qa
          path: qa-v2-phase-a/*.png
          if-no-files-found: error
          retention-days: 14
