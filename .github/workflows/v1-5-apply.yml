name: Apply V1.5 social package

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v1_5_nonworkflow.py'
      - '.github/workflows/v1-5-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V1.5 migration
        run: python3 scripts/apply_v1_5_nonworkflow.py

      - name: Validate migration locally
        run: |
          python3 scripts/site_check.py
          python3 scripts/release_check.py
          python3 -m json.tool vercel.json > /dev/null
          node --check assets/js/main.js

      - name: Commit non-workflow V1.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/index.html tr/index.html scripts/site_check.py scripts/release_check.py README.md docs/V1_5_SOCIAL_SHARING.md
          git commit -m 'feat: wire V1.5 social sharing metadata'
          git push origin HEAD:main
