name: Responsive visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'en/**'
      - 'tr/**'
      - '404.html'
      - 'assets/**'
      - '.github/workflows/responsive-visual-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'en/**'
      - 'tr/**'
      - '404.html'
      - 'assets/**'
      - '.github/workflows/responsive-visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium browser found on runner" >&2
            exit 1
          fi
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install QA browser controller
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Start local site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ainos-http.log 2>&1 &
          echo $! > /tmp/ainos-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/en/ >/dev/null && curl -fsS http://127.0.0.1:4173/tr/ >/dev/null && curl -fsS http://127.0.0.1:4173/404.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ainos-http.log >&2 || true
          exit 1

      - name: Verify no-JavaScript mobile fallback
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          node <<'JS'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            try {
              for (const language of ['en', 'tr']) {
                const page = await browser.newPage();
                await page.setJavaScriptEnabled(false);
                await page.setViewport({ width: 360, height: 900, deviceScaleFactor: 1 });
                await page.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });

                const state = await page.evaluate(() => {
                  const nav = document.querySelector('.nav-links');
                  const reveal = document.querySelector('.reveal');
                  return {
                    navDisplay: nav ? getComputedStyle(nav).display : null,
                    revealOpacity: reveal ? getComputedStyle(reveal).opacity : null,
                    mobileToggleExists: Boolean(document.querySelector('.mobile-menu-toggle'))
                  };
                });

                console.log(language, state);
                if (!state.navDisplay || state.navDisplay === 'none') {
                  throw new Error(`${language}: primary navigation is unavailable without JavaScript`);
                }
                if (state.revealOpacity === '0') {
                  throw new Error(`${language}: reveal content is hidden without JavaScript`);
                }
                if (state.mobileToggleExists) {
                  throw new Error(`${language}: JavaScript-only mobile toggle unexpectedly exists with JavaScript disabled`);
                }

                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Verify V2 visual contracts
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          node <<'JS'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            try {
              for (const language of ['en', 'tr']) {
                for (const width of [1440, 390, 360]) {
                  const page = await browser.newPage();
                  await page.setViewport({ width, height: 1000, deviceScaleFactor: 1 });
                  await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                  await page.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });

                  const state = await page.evaluate(() => ({
                    overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                    heroRadius: getComputedStyle(document.querySelector('.hero-shell')).borderRadius,
                    focusCount: document.querySelectorAll('#focus .focus-card').length,
                    teamCount: document.querySelectorAll('#team .person').length,
                    marketPanelCount: document.querySelectorAll('#focus + section .panel').length,
                    focusRadius: getComputedStyle(document.querySelector('#focus .focus-card')).borderRadius,
                    marketRadius: getComputedStyle(document.querySelector('#focus + section .pill')).borderRadius
                  }));

                  if (state.overflow > 1) throw new Error(`${language}: horizontal overflow at ${width}px: ${state.overflow}px`);
                  if (state.heroRadius !== '0px') throw new Error(`${language}: V2 hero shell must remain square/editorial`);
                  if (state.focusCount !== 4 || state.focusRadius !== '0px') throw new Error(`${language}: V2 Current Focus contract failed`);
                  if (state.teamCount !== 2) throw new Error(`${language}: V2 Team contract failed`);
                  if (state.marketPanelCount !== 2 || state.marketRadius !== '0px') throw new Error(`${language}: V2 Markets contract failed`);

                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Verify V2 interaction contracts
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            try {
              for (const language of ['en', 'tr']) {
                const page = await browser.newPage();
                await page.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1 });
                await page.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });
                await wait(120);

                const topState = await page.evaluate(() => ({
                  compact: document.querySelector('.nav')?.classList.contains('is-compact') || false,
                  navHeight: parseFloat(getComputedStyle(document.querySelector('.nav-inner')).minHeight) || 0,
                  currentCount: document.querySelectorAll('.nav-links a[aria-current="location"]').length
                }));
                if (topState.compact) throw new Error(`${language}: nav must not be compact at page top`);
                if (topState.currentCount !== 0) throw new Error(`${language}: no desktop section should be current at page top`);

                await page.evaluate(() => document.querySelector('#focus')?.scrollIntoView({ behavior: 'auto', block: 'start' }));
                await wait(260);

                const focusState = await page.evaluate(() => {
                  const nav = document.querySelector('.nav');
                  const navInner = document.querySelector('.nav-inner');
                  const link = document.querySelector('.nav-links a[href="#focus"]');
                  return {
                    compact: nav?.classList.contains('is-compact') || false,
                    navHeight: navInner ? parseFloat(getComputedStyle(navInner).minHeight) || 0 : 0,
                    active: link?.classList.contains('is-active') || false,
                    current: link?.getAttribute('aria-current') || '',
                    currentCount: document.querySelectorAll('.nav-links a[aria-current="location"]').length
                  };
                });

                if (!focusState.compact) throw new Error(`${language}: nav did not enter compact state after scroll`);
                if (!(focusState.navHeight < topState.navHeight)) throw new Error(`${language}: compact nav did not reduce min-height (${topState.navHeight} -> ${focusState.navHeight})`);
                if (!focusState.active || focusState.current !== 'location' || focusState.currentCount !== 1) {
                  throw new Error(`${language}: desktop active-section state failed for Current Focus`);
                }
                await page.close();

                const mobile = await browser.newPage();
                await mobile.setViewport({ width: 390, height: 900, deviceScaleFactor: 1 });
                await mobile.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });
                await wait(120);
                await mobile.click('.mobile-menu-toggle');
                await wait(80);

                const openState = await mobile.evaluate(() => ({
                  expanded: document.querySelector('.mobile-menu-toggle')?.getAttribute('aria-expanded'),
                  hidden: document.querySelector('#mobile-navigation')?.hidden,
                  open: document.querySelector('#mobile-navigation')?.classList.contains('is-open') || false
                }));
                if (openState.expanded !== 'true' || openState.hidden !== false || !openState.open) {
                  throw new Error(`${language}: mobile navigation did not open accessibly`);
                }

                await mobile.click('#mobile-navigation a[href="#team"]');
                await wait(300);
                const mobileTeamState = await mobile.evaluate(() => {
                  const toggle = document.querySelector('.mobile-menu-toggle');
                  const menu = document.querySelector('#mobile-navigation');
                  const teamLink = document.querySelector('.nav-links a[href="#team"]');
                  return {
                    expanded: toggle?.getAttribute('aria-expanded'),
                    hidden: menu?.hidden,
                    teamCurrent: teamLink?.getAttribute('aria-current') || '',
                    compact: document.querySelector('.nav')?.classList.contains('is-compact') || false
                  };
                });
                if (mobileTeamState.expanded !== 'false' || mobileTeamState.hidden !== true) {
                  throw new Error(`${language}: mobile navigation did not close after section selection`);
                }
                if (mobileTeamState.teamCurrent !== 'location' || !mobileTeamState.compact) {
                  throw new Error(`${language}: section tracking failed after mobile navigation`);
                }
                await mobile.close();

                const reduced = await browser.newPage();
                await reduced.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
                await reduced.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                await reduced.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });
                await wait(120);
                const reducedState = await reduced.evaluate(() => ({
                  heroAnimation: getComputedStyle(document.querySelector('.hero-main'), '::before').animationName,
                  navTransition: getComputedStyle(document.querySelector('.nav')).transitionDuration,
                  btnTransition: getComputedStyle(document.querySelector('.btn')).transitionDuration
                }));
                if (reducedState.heroAnimation !== 'none') throw new Error(`${language}: reduced-motion hero geometry must not animate`);
                if (!reducedState.navTransition.split(',').every(value => value.trim() === '0s')) throw new Error(`${language}: reduced-motion nav transition is still enabled`);
                if (!reducedState.btnTransition.split(',').every(value => value.trim() === '0s')) throw new Error(`${language}: reduced-motion button transition is still enabled`);
                await reduced.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Capture responsive screenshots
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          mkdir -p qa-responsive
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          const path = require('path');

          const widths = [1440, 1024, 768, 390, 360];
          const languages = ['en', 'tr'];
          const sections = [
            { key: 'hero', selector: '.hero' },
            { key: 'what', selector: '#what' },
            { key: 'focus', selector: '#focus' },
            { key: 'markets', selector: '#focus + section' },
            { key: 'team', selector: '#team' }
          ];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars']
            });

            try {
              for (const language of languages) {
                for (const width of widths) {
                  const page = await browser.newPage();
                  await page.setViewport({ width, height: 1100, deviceScaleFactor: 1 });
                  await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                  await page.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });
                  await wait(150);

                  for (const section of sections) {
                    await page.evaluate((selector) => {
                      const el = document.querySelector(selector);
                      if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
                    }, section.selector);
                    await wait(180);
                    await page.screenshot({
                      path: path.join('qa-responsive', `${language}-${width}-${section.key}.png`),
                      fullPage: false
                    });
                  }

                  await page.close();
                }
              }

              for (const width of [1440, 360]) {
                const page = await browser.newPage();
                await page.setViewport({ width, height: 1000, deviceScaleFactor: 1 });
                await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                await page.goto('http://127.0.0.1:4173/404.html', { waitUntil: 'networkidle0' });
                await wait(150);
                await page.screenshot({
                  path: path.join('qa-responsive', `404-${width}.png`),
                  fullPage: false
                });
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

          ls -lh qa-responsive

      - name: Upload responsive QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-qa
          path: qa-responsive/*.png
          if-no-files-found: error
          retention-days: 14
