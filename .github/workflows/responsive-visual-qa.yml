name: Responsive visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'en/**'
      - 'tr/**'
      - 'assets/**'
      - '.github/workflows/responsive-visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium browser found on runner" >&2
            exit 1
          fi
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install QA browser controller
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Start local site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ainos-http.log 2>&1 &
          echo $! > /tmp/ainos-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/en/ >/dev/null && curl -fsS http://127.0.0.1:4173/tr/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ainos-http.log >&2 || true
          exit 1

      - name: Capture responsive screenshots
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -euo pipefail
          mkdir -p qa-responsive
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          const path = require('path');

          const widths = [1440, 1024, 768, 390, 360];
          const languages = ['en', 'tr'];
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars']
            });

            try {
              for (const language of languages) {
                for (const width of widths) {
                  const page = await browser.newPage();
                  await page.setViewport({ width, height: 1100, deviceScaleFactor: 1 });
                  await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
                  await page.goto(`http://127.0.0.1:4173/${language}/`, { waitUntil: 'networkidle0' });
                  await wait(150);

                  await page.screenshot({
                    path: path.join('qa-responsive', `${language}-${width}-hero.png`),
                    fullPage: false
                  });

                  for (const section of ['focus', 'team']) {
                    await page.evaluate((id) => {
                      const el = document.getElementById(id);
                      if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
                    }, section);
                    await wait(180);
                    await page.screenshot({
                      path: path.join('qa-responsive', `${language}-${width}-${section}.png`),
                      fullPage: false
                    });
                  }

                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

          ls -lh qa-responsive

      - name: Upload responsive QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-qa
          path: qa-responsive/*.png
          if-no-files-found: error
          retention-days: 14
