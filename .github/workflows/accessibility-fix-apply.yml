name: Apply accessibility hardening

on:
  push:
    branches: [performance-cwv-baseline]
    paths:
      - '.github/workflows/accessibility-fix-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: performance-cwv-baseline

      - name: Apply measured accessibility fixes
        run: python3 scripts/apply_accessibility_hardening.py

      - name: Validate site and release contracts
        run: |
          python3 scripts/site_check.py
          python3 scripts/release_check.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- en/index.html tr/index.html assets/css/team-tuning.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/index.html tr/index.html assets/css/team-tuning.css
          git commit -m "fix: harden text contrast and accessible labels"
          git push origin HEAD:performance-cwv-baseline
